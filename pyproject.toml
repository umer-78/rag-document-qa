[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragqa"
version = "1.0.0"
description = "Ask questions about your own documents: chunking, BM25 + TF-IDF hybrid retrieval, extractive answers with citations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Umer Hashmi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
ragqa = "ragqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
